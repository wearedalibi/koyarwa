<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ t("setup.title") }} · Koyarwa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/static/admin.css" />
    <script src="/admin/static/htmx.min.js"></script>
    <script src="/admin/static/lucide.min.js"></script>
    <script src="/admin/static/ui.js"></script>
    <style>
      .stepper { list-style: none; display: flex; padding: 0; margin: 0 0 24px; }
      .stepper li {
        flex: 1; position: relative; display: flex; flex-direction: column;
        align-items: center; gap: 6px; text-align: center;
        font-size: 0.78rem; color: var(--colorNeutralForeground3);
      }
      .stepper li::before {
        content: ""; position: absolute; top: 15px; left: -50%;
        width: 100%; height: 2px; background: var(--colorNeutralStroke2); z-index: 0;
      }
      .stepper li:first-child::before { display: none; }
      .stepper .dot {
        position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center; font-weight: 600;
        background: var(--colorNeutralBackground1); border: 2px solid var(--colorNeutralStroke2);
      }
      .stepper .dot .lucide { width: 16px; height: 16px; }
      .stepper li.current { color: var(--colorBrandForeground1); font-weight: 600; }
      .stepper li.current .dot { border-color: var(--colorBrandForeground1); color: var(--colorBrandForeground1); }
      .stepper li.done { color: var(--colorNeutralForeground2); }
      .stepper li.done .dot {
        background: var(--colorBrandBackground); border-color: var(--colorBrandBackground); color: #fff;
      }
      select {
        width: 100%; padding: 6px 10px; font: inherit; font-size: 14px;
        color: var(--colorNeutralForeground1); background: var(--colorNeutralBackground1);
        border: 1px solid var(--colorNeutralStroke1); border-radius: var(--borderRadiusMedium);
      }
      button.btn-secondary {
        background: var(--colorNeutralBackground3); color: var(--colorNeutralForeground1);
        border: 1px solid var(--colorNeutralStroke1);
      }
      button.btn-secondary:hover { background: var(--colorNeutralBackground1Hover); }
      .ok {
        color: #0e7a63; background: #e4f3ef; border: 1px solid #0e7a63;
        border-radius: var(--borderRadiusMedium); padding: 8px 12px;
        display: flex; align-items: center; gap: 8px;
      }
      /* Mise en page de l'assistant : fin header + contenu centré */
      .setup-body { min-height: 100vh; display: flex; flex-direction: column; }
      .setup-topbar {
        flex: none; display: flex; align-items: center; justify-content: flex-end;
        height: 48px; padding: 0 16px;
      }
      /* Centrage par marges auto : centré quand le contenu tient, défilement
         normal (sans rognage du haut) quand il dépasse la hauteur de l'écran. */
      main.setup-main {
        flex: 1 1 auto; max-width: none; margin: 0; padding: 24px;
        display: flex;
      }
      main.setup-main .auth { margin: auto; width: 100%; max-width: 520px; }
      /* Logo au-dessus des étapes */
      .setup-brand {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        margin-bottom: 20px;
      }
      .setup-brand svg { width: 34px; height: 34px; flex: none; }
      .setup-brand .name {
        font-family: "Google Sans", "Segoe UI", sans-serif;
        font-weight: 700; font-size: 1.25rem; color: var(--colorNeutralForeground1);
      }
      /* Actions de bas de formulaire (retour + suivant) */
      .setup-actions { display: flex; align-items: center; gap: 8px; }
      .btn-back {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 6px 16px; font-size: 14px; font-weight: 600;
        color: var(--colorNeutralForeground2);
        background: var(--colorNeutralBackground3);
        border: 1px solid var(--colorNeutralStroke1);
        border-radius: var(--borderRadiusMedium);
        text-decoration: none;
      }
      .btn-back:hover { background: var(--colorNeutralBackground1Hover); text-decoration: none; }
    </style>
  </head>
  <body class="setup-body">
    <header class="setup-topbar">
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Basculer le thème">
        <i data-lucide="moon"></i>
      </button>
    </header>
    <main class="setup-main">
      <div class="auth">
        <div class="setup-brand">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Koyarwa">
            <rect width="64" height="64" rx="14" fill="#0f6cbd" />
            <path d="M22 16h7v13.5L40.5 16H49L36 32l13 16h-8.5L29 34.5V48h-7z" fill="#fff" />
          </svg>
          <span class="name">Koyarwa</span>
        </div>
        <ol class="stepper">
          {% for s in steps %}
          <li class="{{ s.state }}">
            <span class="dot">{% if s.state == 'done' %}<i data-lucide="check"></i>{% else %}{{ s.n }}{% endif %}</span>
            <span class="lbl">{{ s.label }}</span>
          </li>
          {% endfor %}
        </ol>
        {% block content %}{% endblock %}
      </div>
    </main>
    <script>
      function renderIcons() {
        if (window.lucide) window.lucide.createIcons();
      }
      document.addEventListener("DOMContentLoaded", renderIcons);
      document.addEventListener("htmx:afterSettle", renderIcons);
    </script>
  </body>
</html>
