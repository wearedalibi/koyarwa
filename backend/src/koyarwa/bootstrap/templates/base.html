<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ t("setup.title") }} · Koyarwa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/static/admin.css" />
    <script src="/admin/static/htmx.min.js"></script>
    <script src="/admin/static/lucide.min.js"></script>
    <style>
      .steps {
        list-style: none; display: flex; flex-wrap: wrap; gap: 14px;
        padding: 0; margin: 0 0 20px; font-size: 0.85rem;
        color: var(--colorNeutralForeground3);
      }
      .steps li.on { color: var(--colorBrandForeground1); font-weight: 600; }
      select {
        width: 100%; padding: 6px 10px; font: inherit; font-size: 14px;
        color: var(--colorNeutralForeground1); background: var(--colorNeutralBackground1);
        border: 1px solid var(--colorNeutralStroke1); border-radius: var(--borderRadiusMedium);
      }
      button.btn-secondary {
        background: var(--colorNeutralBackground3); color: var(--colorNeutralForeground1);
        border: 1px solid var(--colorNeutralStroke1);
      }
      button.btn-secondary:hover { background: var(--colorNeutralBackground1Hover); }
      .ok {
        color: #0e7a63; background: #e4f3ef; border: 1px solid #0e7a63;
        border-radius: var(--borderRadiusMedium); padding: 8px 12px;
        display: flex; align-items: center; gap: 8px;
      }
    </style>
  </head>
  <body>
    <header class="appbar">
      <span class="brand"><i data-lucide="graduation-cap"></i> Koyarwa</span>
      <span class="user">{{ t("setup.title") }}</span>
    </header>
    <main>
      <div class="auth" style="max-width: 520px">
        <ol class="steps">
          <li class="{{ 'on' if step == 'language' else '' }}">1 · {{ t("setup.step.language") }}</li>
          <li class="{{ 'on' if step == 'database' else '' }}">2 · {{ t("setup.step.database") }}</li>
          <li class="{{ 'on' if step == 'admin' else '' }}">3 · {{ t("setup.step.admin") }}</li>
        </ol>
        {% block content %}{% endblock %}
      </div>
    </main>
    <script>
      function renderIcons() {
        if (window.lucide) window.lucide.createIcons();
      }
      document.addEventListener("DOMContentLoaded", renderIcons);
      document.addEventListener("htmx:afterSettle", renderIcons);
    </script>
  </body>
</html>
