{% extends "base.html" %}
{% block content %}
<h1><i data-lucide="shield-check"></i> {{ t("setup.token.title") }}</h1>
<p class="subtitle">{{ t("setup.token.intro") }}</p>
{% if error %}<p class="error">{{ t("setup.token.invalid") }}</p>{% endif %}
<form class="card stack" method="post" action="/setup/token">
  <div class="field">
    <label for="token">{{ t("setup.token.label") }}</label>
    <input id="token" name="token" autocomplete="off" autofocus />
  </div>
  <button type="submit"><i data-lucide="arrow-right"></i> {{ t("setup.token.continue") }}</button>
</form>
{% endblock %}
