{% extends "base.html" %}
{% block content %}
<h1><i data-lucide="user-cog"></i> {{ t("setup.step.admin") }}</h1>
<p class="subtitle">{{ t("setup.admin.intro") }}</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form class="card stack" method="post" action="/setup/admin">
  <div class="field">
    <label for="name">{{ t("setup.admin.name") }}</label>
    <input id="name" name="name" autocomplete="name" />
  </div>
  <div class="field">
    <label for="email">{{ t("setup.admin.email") }}</label>
    <input id="email" name="email" type="email" autocomplete="email" required />
  </div>
  <div class="field">
    <label for="username">{{ t("setup.admin.username") }}</label>
    <input id="username" name="username" autocomplete="username" required />
  </div>
  <div class="field">
    <label for="password">{{ t("setup.admin.password") }}</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />
  </div>
  <button type="submit"><i data-lucide="circle-check-big"></i> {{ t("setup.finish") }}</button>
</form>
{% endblock %}
