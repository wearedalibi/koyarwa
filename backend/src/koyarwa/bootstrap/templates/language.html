{% extends "base.html" %}
{% block content %}
<h1><i data-lucide="languages"></i> {{ t("setup.step.language") }}</h1>
<p class="subtitle">{{ t("setup.language.intro") }}</p>
<form class="card stack" method="post" action="/setup">
  <div class="field">
    <label for="language">{{ t("common.language") }}</label>
    <select id="language" name="language">
      <option value="fr" {{ "selected" if lang == "fr" else "" }}>Français</option>
      <option value="en" {{ "selected" if lang == "en" else "" }}>English</option>
      <option value="de" {{ "selected" if lang == "de" else "" }}>Deutsch</option>
    </select>
  </div>
  <button type="submit"><i data-lucide="arrow-right"></i> {{ t("common.next") }}</button>
</form>
{% endblock %}
