<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Admin{% endblock %} · Koyarwa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/static/admin.css" />
    <script src="/admin/static/htmx.min.js"></script>
    <script src="/admin/static/lucide.min.js"></script>
    <script src="/admin/static/ui.js"></script>
  </head>
  <body>
    <header class="appbar">
      <span class="brand"><i data-lucide="layout-dashboard"></i> Koyarwa · Admin</span>
      {% if user %}
      <span class="user">{{ user }} · <a href="/admin/logout"><i data-lucide="log-out"></i> Déconnexion</a></span>
      {% endif %}
    </header>
    <main>{% block content %}{% endblock %}</main>
    <script>
      // Convertit les <i data-lucide="…"> en SVG, au chargement et après chaque swap HTMX.
      function renderIcons() {
        if (window.lucide) window.lucide.createIcons();
      }
      document.addEventListener("DOMContentLoaded", renderIcons);
      document.addEventListener("htmx:afterSettle", renderIcons);
    </script>
  </body>
</html>
