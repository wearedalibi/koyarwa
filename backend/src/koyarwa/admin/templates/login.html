{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="auth">
  <h1><i data-lucide="lock"></i> Connexion</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form class="card stack" method="post" action="/admin/login">
    <div class="field">
      <label for="username">Utilisateur</label>
      <input id="username" name="username" autocomplete="username" autofocus />
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <div class="pw" data-pw>
        <input id="password" name="password" type="password" autocomplete="current-password" />
        <button type="button" class="pw-toggle" data-pw-toggle aria-label="Afficher le mot de passe" aria-pressed="false"><i data-lucide="eye"></i></button>
      </div>
    </div>
    <button type="submit"><i data-lucide="log-in"></i> Se connecter</button>
  </form>
</div>
{% endblock %}
